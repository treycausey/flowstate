[package]
name = "flowstate"
version = "0.1.0"
description = "Flowstate desktop and iOS app"
authors = ["Flowstate"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "flowstate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "~2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "~2.5.4"
rusqlite = { version = "0.30", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde", "clock"] }

# Xcode 27 / iOS 27 SDK workarounds, copied from the Stash iOS app (~/dev/stash/apps/ios/src-tauri/Cargo.toml).
# swift-rs 1.0.7 with `swift build --build-system native` (Xcode 27's SwiftPM defaults to the swiftbuild engine,
# which fails on Tauri's iOS Swift package). tao 0.35.3 with the tao#1245 fix (released UISceneConfiguration
# segfaults at launch once the scene lifecycle is on). Drop each when upstream covers it.
[patch.crates-io]
swift-rs = { path = "vendor/swift-rs" }
tao = { path = "vendor/tao" }
